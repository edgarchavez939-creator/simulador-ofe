<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ejemplo de integración · Simulador de crédito Uninorte</title>
<style>
body{margin:0;background:#f6f4f1;color:#242424;font-family:Arial,sans-serif}main{max-width:1320px;margin:auto;padding:24px}header{border-top:4px solid #960a11;background:#fff;padding:24px;border-radius:12px 12px 0 0}h1{font-size:24px;margin:0 0 10px}p{font-size:15px;line-height:1.6;margin:0 0 12px}a{color:#960a11}iframe{display:block;width:100%;height:1100px;border:0;background:#fff}.example-note{font-size:12px;color:#666;padding:12px 0}@media(max-width:640px){main{padding:12px}header{padding:18px}h1{font-size:21px}}
</style>
</head>
<body>
<!-- DTIC: sustituir simulador.ejemplo.invalid por APP_ORIGIN y autorizar el origen del portal. -->
<main>
<header>
<h1>Simula tu crédito Uninorte</h1>
<p>Explora las opciones de financiación y consulta una estimación de tus cuotas.</p>
<a href="https://simulador.ejemplo.invalid/simulador/" target="_blank" rel="noopener">Abrir el simulador en una nueva ventana</a>
</header>
<iframe src="https://simulador.ejemplo.invalid/apps/public/" title="Simulador de crédito de la Universidad del Norte" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<p class="example-note">Plantilla: sustituir el dominio de ejemplo por el institucional y habilitar el acceso público en el servidor.</p>
</main>
</body>
</html>

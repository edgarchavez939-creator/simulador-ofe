<!doctype html>
<html lang="es" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · Simulador de Crédito</title><script src="/auth-assets/theme.js"></script><link rel="stylesheet" href="/auth-assets/styles.css"></head>
<body class="auth-page"><main class="auth-card card"><div class="auth-brand">OFE · UNIVERSIDAD DEL NORTE</div><h1>Simulador de Crédito</h1><p class="auth-intro">Tu espacio de simulación y administración.</p>
<button class="btn btn--ghost btn--sm" id="auth-theme" type="button">Cambiar tema</button>
<form id="login-form"><h2 id="auth-title">Iniciar sesión</h2>
<div class="field" id="email-field"><label class="field__label" for="email">Correo</label><input class="input" id="email" name="email" type="email" autocomplete="username" required maxlength="200"></div>
<div class="field" id="current-field" hidden><label class="field__label" for="currentPassword">Contraseña actual</label><input class="input" id="currentPassword" type="password" autocomplete="current-password"></div>
<div class="field"><label class="field__label" for="password">Contraseña</label><div class="input-affix"><input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="btn btn--ghost btn--sm" id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Mostrar</button></div></div>
<div class="field" id="confirm-field" hidden><label class="field__label" for="confirmation">Confirmar nueva contraseña</label><input class="input" id="confirmation" type="password" autocomplete="new-password"></div>
<p class="field__hint" id="password-policy" hidden>Elige una contraseña personal de 12 a 128 caracteres.</p>
<p class="feedback feedback--danger" id="auth-error" role="alert" hidden></p>
<button class="btn btn--primary btn--block" id="login-submit" type="submit">Iniciar sesión</button></form>
<p class="text-muted-sm">El acceso y las operaciones administrativas quedan registrados para trazabilidad.</p></main><script src="/auth-assets/login.js"></script></body></html>
